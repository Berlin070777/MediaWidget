name: MediaWidget
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MEDIA_WIDGET_APP_GROUP: ""
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"

targets:
  MediaWidget:
    type: application
    platform: macOS
    sources:
      - path: MediaWidget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediawidget.app
        PRODUCT_MODULE_NAME: MediaWidgetApp
        INFOPLIST_FILE: MediaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MediaWidget/MediaWidget$(MEDIA_WIDGET_ENTITLEMENT_SUFFIX).entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: MediaWidgetExtension
        embed: true
      - target: SafariExtension
        embed: true
      - target: MediaWidgetChromeHost
        embed: false
        link: false
    postBuildScripts:
      - name: Package Chrome integration
        basedOnDependencyAnalysis: false
        script: |
          resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ChromeExtension"
          executables="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}"
          mkdir -p "$resources" "$executables"
          cp "${SRCROOT}/BrowserExtension/Chrome/manifest.json" "$resources/"
          cp "${SRCROOT}/BrowserExtension/Shared/"*.js "$resources/"
          cp "${BUILT_PRODUCTS_DIR}/MediaWidgetChromeHost" "$executables/"

  MediaWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: MediaWidgetExtension
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediawidget.app.widget
        PRODUCT_MODULE_NAME: MediaWidgetExt
        INFOPLIST_FILE: MediaWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MediaWidgetExtension/MediaWidgetExtension$(MEDIA_WIDGET_ENTITLEMENT_SUFFIX).entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  SafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
        excludes: ["Info.plist", "*.entitlements"]
      - path: BrowserExtension/Safari/manifest.json
        buildPhase: resources
      - path: BrowserExtension/Shared
        buildPhase: resources
      - path: MediaWidget/Browser/BrowserBridge.swift
      - path: Shared/Constants.swift
      - path: Shared/MediaInfo.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediawidget.app.safari
        INFOPLIST_FILE: SafariExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SafariExtension/SafariExtension$(MEDIA_WIDGET_ENTITLEMENT_SUFFIX).entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  MediaWidgetChromeHost:
    type: tool
    platform: macOS
    sources:
      - path: ChromeNativeHost
      - path: MediaWidget/Browser/BrowserBridge.swift
      - path: Shared/Constants.swift
      - path: Shared/MediaInfo.swift
    settings:
      base:
        PRODUCT_NAME: MediaWidgetChromeHost

schemes:
  MediaWidget:
    build:
      targets:
        MediaWidget: all
    run:
      config: Debug
    archive:
      config: Release
